<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OneTapTower" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d0d17" />
  <meta name="description" content="One Tap Tower - Retro 8-bit endless arcade tower climbing game!" />
  <title>One Tap Tower [8-BIT]</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d17;
      font-family: 'Press Start 2P', monospace;
      touch-action: none;
      color: #ffffff;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d17;
    }

    #game-canvas {
      display: block;
      touch-action: none;
      cursor: pointer;
      border: 3px solid #2d2d44;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.3s steps(4);
      pointer-events: none;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 4vw, 24px);
      letter-spacing: 2px;
      color: #4ecdc4;
      text-shadow: 3px 3px 0px #e74c3c;
      margin-bottom: 24px;
      text-align: center;
    }

    .loader-bar-bg {
      width: 240px;
      height: 16px;
      background: #0d0d17;
      border: 2px solid #ffffff;
      position: relative;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: #4ecdc4;
      transition: width 0.15s steps(8);
    }

    .loader-subtext {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #f39c12;
      text-transform: uppercase;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-GN1lze7k.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="loading-screen">
      <div class="loader-title">ONE TAP TOWER</div>
      <div class="loader-bar-bg">
        <div id="loader-fill" class="loader-bar-fill"></div>
      </div>
      <div id="loader-text" class="loader-subtext">LOADING...</div>
    </div>
  </div>

</body>
</html>
